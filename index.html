<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><title>博士日课</title></head>
<body><main>
<header><div><p id="today"></p><h1>博士日课</h1></div><button id="settings" class="icon" aria-label="设置">⚙︎</button></header>
<section id="home" class="page active"><button id="start" class="hero"><span>每日收束 · 让努力可见</span><strong id="heroTitle">今天的研究，留下些什么？</strong><small id="heroSub">用 5–10 分钟，完成一次有条理的复盘。</small><b id="heroCta">开始今日复盘　›</b></button><h2>最近记录</h2><div id="recent"></div></section>
<section id="review" class="page"><div class="progress"><span id="stepText"></span><i><b id="bar"></b></i></div><article class="question"><small id="qTitle"></small><h2 id="qText"></h2><p id="qHint"></p><textarea id="answer" placeholder="每次换行会自动成为一个要点…"></textarea><div class="location"><span id="location">正在获取记录位置…</span><button id="refreshLocation">刷新</button></div></article><div class="actions"><button id="back" class="secondary">上一个</button><button id="next">下一题</button></div></section>
<section id="archive" class="page"><input id="search" type="search" placeholder="检索目标、问题或关键词"><div id="records"></div></section>
<section id="insights" class="page"><div class="segmented"><button data-days="7" class="selected">近 7 天</button><button data-days="30">近 30 天</button></div><div class="stats" id="stats"></div><article><h2>每日完成度</h2><div id="chart" class="chart"></div></article><article><h2 id="summaryTitle">本周复盘</h2><p id="summary"></p></article></section>
<section id="preferences" class="page"><article><h2>每日复盘提醒</h2><p>下载系统日历提醒后，iPhone 即使未打开本应用，也会在每晚 23:00 提醒你。</p><button id="calendar">下载每晚 23:00 提醒</button></article><article><h2>数据管理</h2><p>导出包含全部复盘内容的 Excel 文件，文件名会附带导出时刻。</p><button id="excel">导出 Excel</button><button id="json" class="plain">备份 JSON 数据</button></article><article><h2>隐私与定位</h2><p>全部记录仅保存在本设备浏览器内。定位仅保存经纬度，首次记录时会请求权限。</p><button id="locate" class="plain">测试定位权限</button></article></section>
</main><nav><button data-page="home" class="active">⌂<span>首页</span></button><button data-page="archive">▤<span>档案</span></button><button data-page="insights">▥<span>洞见</span></button></nav><div id="modal" class="modal hidden"><div><button id="close" class="icon">×</button><section id="detail"></section></div></div><script src="app.js"></script></body></html>
